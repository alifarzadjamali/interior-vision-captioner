[project]
name = "room-captioner"
version = "1.0.0"
description = "A small, reproducible workflow for captioning interior design images."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=3.3,<5",
    "pillow>=10,<13",
    "torch>=2.2,<3",
    "transformers==4.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
room-captioner = "room_captioner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["room_captioner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
